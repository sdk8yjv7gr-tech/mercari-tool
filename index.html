<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>メルカリ簡単出品</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: #f7f7f7;
    }

    h1 {
      text-align: center;
    }

    .category {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 30px;
    }

    .category button {
      padding: 25px 10px;
      font-size: 18px;
      border: none;
      border-radius: 15px;
      background-color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .category button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <h1>メルカリ簡単出品 🐺</h1>

  <p style="text-align:center;">
    出品するグッズを選んでね
  </p>

  <div class="category">

    <button>🃏<br>トレカ</button>

    <button>💿<br>アルバム</button>

    <button>🧍<br>アクスタ</button>

    <button>📸<br>ポラ・フォト</button>

    <button>🧸<br>SKZOO</button>

    <button>🎁<br>その他</button>

  </div>

</body>
</html>
