<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>メルカリ簡単出品</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-color: #f7f7f7;
    }

    h1 {
      text-align: center;
    }

    h2 {
      margin-top: 30px;
      border-bottom: 2px solid #ddd;
      padding-bottom: 8px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: white;
    }

    .category {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 30px;
    }

    .category button {
      padding: 25px 10px;
      font-size: 18px;
      border: none;
      border-radius: 15px;
      background-color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .back-button {
      margin-top: 20px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background-color: #ddd;
      font-size: 14px;
    }

    .checkbox {
      margin-top: 12px;
      font-weight: normal;
    }

    .checkbox input {
      width: auto;
      margin-right: 8px;
    }

    .main-button {
      width: 100%;
      margin-top: 30px;
      padding: 16px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background-color: #333;
      color: white;
    }
  </style>
</head>

<body>

  <!-- カテゴリー選択画面 -->

  <div id="categoryScreen">

    <h1>メルカリ簡単出品 🐺</h1>

    <p style="text-align:center;">
      出品するグッズを選んでね
    </p>

    <div class="category">

      <button onclick="showCardForm()">🃏<br>トレカ</button>

      <button>💿<br>アルバム</button>

      <button>🧍<br>アクスタ</button>

      <button>📸<br>ポラ・フォト</button>

      <button>🧸<br>SKZOO</button>

      <button>🎁<br>その他</button>

    </div>

  </div>


  <!-- トレカ入力画面 -->

  <div id="cardScreen" style="display:none;">

    <h1>🃏 トレカ出品</h1>

    <h2>基本情報</h2>

    <label>メンバー（複数選択OK）</label>

<div id="memberList">

  <label class="checkbox">
    <input type="checkbox" name="member" value="バンチャン">
    バンチャン
  </label>

  <label class="checkbox">
    <input type="checkbox" name="member" value="リノ">
    リノ
  </label>

  <label class="checkbox">
    <input type="checkbox" name="member" value="チャンビン">
    チャンビン
  </label>

  <label class="checkbox">
    <input type="checkbox" name="member" value="ヒョンジン">
    ヒョンジン
  </label>

  <label class="checkbox">
    <input type="checkbox" name="member" value="ハン">
    ハン
  </label>

  <label class="checkbox">
    <input type="checkbox" name="member" value="フィリックス">
    フィリックス
  </label>

  <label class="checkbox">
    <input type="checkbox" name="member" value="スンミン">
    スンミン
  </label>

  <label class="checkbox">
    <input type="checkbox" name="member" value="I.N">
    I.N
  </label>

</div>

    <label>作品・アルバム</label>

<select id="work" onchange="showOtherWork()">
  <option value="">選択してください</option>
  <option value="I am YOU">I am YOU</option>
  <option value="Clé 1 : MIROH">Clé 1 : MIROH</option>
  <option value="Clé : LEVANTER">Clé : LEVANTER</option>
  <option value="GO生">GO生</option>
  <option value="IN生">IN生</option>
  <option value="NOEASY">NOEASY</option>
  <option value="ODDINARY">ODDINARY</option>
  <option value="MAXIDENT">MAXIDENT</option>
  <option value="THE SOUND">THE SOUND</option>
  <option value="★★★★★ (5-STAR)">★★★★★ (5-STAR)</option>
  <option value="Social Path">Social Path</option>
  <option value="その他">その他</option>
</select>

<input
  type="text"
  id="otherWork"
  placeholder="作品・アルバム名を入力"
  style="display:none;"
>

   <label>特典・店舗</label>

<select id="benefit" onchange="showOtherBenefit()">
  <option value="">選択してください</option>
  <option value="Soundwave">Soundwave</option>
  <option value="タワレコ">タワレコ</option>
  <option value="HMV">HMV</option>
  <option value="ソニミュ">ソニーミュージック</option>
  <option value="JYP SHOP">JYP SHOP</option>
  <option value="その他">その他</option>
</select>

<input
  type="text"
  id="otherBenefit"
  placeholder="特典・店舗名を入力"
  style="display:none;"
>

    <label>カードの種類</label>
    <select id="cardType">
      <option>封入トレカ</option>
      <option>店舗特典</option>
      <option>ラキドロ</option>
      <option>ポラロイド</option>
      <option>その他</option>
    </select>

    <label>加工</label>
    <select id="finish">
      <option>なし</option>
      <option>ホログラム</option>
      <option>マット</option>
      <option>その他</option>
    </select>


    <h2>状態</h2>

    <label>商品の状態</label>
    <select id="condition">
      <option>新品・未使用</option>
      <option>未使用に近い</option>
      <option>目立った傷や汚れなし</option>
      <option>やや傷や汚れあり</option>
      <option>傷や汚れあり</option>
    </select>

    <label>傷・スレ</label>

<select id="damage" onchange="showOtherDamage()">
  <option value="">なし</option>
  <option value="初期傷あり">初期傷あり</option>
  <option value="裏面スレあり">裏面スレあり</option>
  <option value="表面スレあり">表面スレあり</option>
  <option value="傷・スレあり">傷・スレあり</option>
  <option value="その他">その他</option>
</select>

<input
  type="text"
  id="otherDamage"
  placeholder="傷やスレの内容を入力"
  style="display:none;"
>

    <label>保管方法</label>
    <select id="storage">
      <option>スリーブに入れて保管</option>
      <option>硬質ケースに入れて保管</option>
      <option>ファイルで保管</option>
      <option>その他</option>
    </select>


    <h2>発送</h2>

    <label>補強</label>
    <select id="reinforcement">
      <option>片面厚紙補強</option>
      <option>両面厚紙補強</option>
      <option>硬質ケース</option>
      <option>なし</option>
    </select>

    <label>防水</label>
    <select id="waterproof">
      <option>防水対策あり</option>
      <option>防水対策なし</option>
    </select>

    <label>発送方法</label>
    <select id="shipping">
      <option>普通郵便</option>
      <option>ミニレター</option>
      <option>ゆうゆうメルカリ便</option>
      <option>らくらくメルカリ便</option>
      <option>その他</option>
    </select>


    <h2>定型文</h2>

<p>
  基本の定型文は自動で追加されます。
</p>

<label class="checkbox">
  <input type="checkbox" id="comment">
  購入前にコメントお願いします
</label>

    <h2>販売価格</h2>

    <input
      type="number"
      id="price"
      placeholder="例：1500"
    >

    <button class="main-button" onclick="makeListing()">
  出品文を作る
</button>

<div id="result" style="display:none;">

  <h2>🏷️ 商品タイトル</h2>
  <textarea id="titleResult" rows="2"></textarea>

  <h2>📝 商品説明</h2>
  <textarea id="descriptionResult" rows="12"></textarea>

  <h2>🔎 検索キーワード</h2>
  <textarea id="keywordsResult" rows="5"></textarea>

</div>

    <button
      class="back-button"
      onclick="showCategory()"
    >
      ← カテゴリー選択に戻る
    </button>

  </div>


  <script>

    function showCardForm() {
      document.getElementById("categoryScreen").style.display = "none";
      document.getElementById("cardScreen").style.display = "block";
    }

    function showCategory() {
      document.getElementById("cardScreen").style.display = "none";
      document.getElementById("categoryScreen").style.display = "block";
    }

function showOtherWork() {
  const work = document.getElementById("work").value;
  const otherWork = document.getElementById("otherWork");

  if (work === "その他") {
    otherWork.style.display = "block";
  } else {
    otherWork.style.display = "none";
  }
}

function showOtherBenefit() {
  const benefit = document.getElementById("benefit").value;
  const otherBenefit = document.getElementById("otherBenefit");

  if (benefit === "その他") {
    otherBenefit.style.display = "block";
  } else {
    otherBenefit.style.display = "none";
  }
}

    function showOtherDamage() {
  const damage = document.getElementById("damage").value;
  const otherDamage = document.getElementById("otherDamage");

  if (damage === "その他") {
    otherDamage.style.display = "block";
  } else {
    otherDamage.style.display = "none";
  }
}

    const memberAliases = {
  "バンチャン": [
    "バンチャン",
    "Bang Chan",

  ],

  "リノ": [
    "リノ",

    "이민호"
  ],

  "チャンビン": [
    "チャンビン",
    "Changbin",

    "서창빈"
  ],

  "ヒョンジン": [
    "ヒョンジン",
    "Hyunjin",
    "HYUNJIN",
    "현진",
    "황현진"
  ],

  "ハン": [
    "ハン",
    "HAN",
    "Han Jisung",
    "HAN JISUNG",
    "ハンジソン",
    "한지성"
  ],

  "フィリックス": [
    "フィリックス",
    "Felix",
    "FELIX",

    "이용복"
  ],

  "スンミン": [

  ],

  "I.N": [
    "I.N",
    "アイエン",
    "아이엔",
    "양정인"
  ]
};

    const workAliases = {
  "I am YOU": [
    "I am YOU",
    "I AM YOU",
    "アイアムユー"
  ],

  "Clé 1 : MIROH": [
    "Clé 1 : MIROH",
    "MIROH",
    "ミロ"
  ],

  "Clé : LEVANTER": [
    "Clé : LEVANTER",
    "LEVANTER",
    "レバンター"
  ],

  "GO生": [
    "GO生",
    "GO LIVE",
    "ゴーライブ"
  ],

  "IN生": [
    "IN生",
    "IN LIFE",
    "インライフ"
  ],

  "NOEASY": [
    "NOEASY",
    "ノーイージー"
  ],

  "ODDINARY": [
    "ODDINARY",
    "Oddinary",
    "オディ",
    "オディナリー"
  ],

  "MAXIDENT": [
    "MAXIDENT",
    "マキシデント"
  ],

  "THE SOUND": [

    "ザ・サウンド"
  ],

  "★★★★★ (5-STAR)": [
    "5-STAR",
    "5 STAR",
    "ファイブスター"
  ],

  "Social Path": [
    "Social Path",
    "ソーシャルパス"
  ]
};

    const benefitAliases = {
  "soundwave": [
    "Soundwave",
    "Sound wave",
    "サウンドウェーブ",
    "サウェ"
  ],

  "タワレコ": [
    "タワレコ",
    "タワーレコード",
    "Tower Records"
  ],

  "hmv": [
    "HMV",
    "HMV&BOOKS"
  ],

  "ソニミュ": [
    "ソニーミュージック",
    "Sony Music",
    "Sony Music Shop",
    "ソニミュ"
  ],

  "jyp": [
    "JYP SHOP",
    "JYP SHOP JAPAN"
  ],

  "ラキドロ": [
    "ラキドロ",
    "Lucky Draw",
    "ラッキードロー"
  ]
};
    
    function makeListing() {

  const selectedMembers = Array.from(
  document.querySelectorAll('input[name="member"]:checked')
).map(input => input.value);

if (selectedMembers.length === 0) {
  alert("メンバーを1人以上選択してください");
  return;
}

const member = selectedMembers.join(" ");
  const work = document.getElementById("work").value;
  const otherWork = document.getElementById("otherWork").value;
  const benefitSelect = document.getElementById("benefit").value;
const otherBenefit = document.getElementById("otherBenefit").value;

const benefit =
  benefitSelect === "その他"
    ? otherBenefit
    : benefitSelect;
  const cardType = document.getElementById("cardType").value;
  const finish = document.getElementById("finish").value;
  const condition = document.getElementById("condition").value;
  const damage = document.getElementById("damage").value;
  const storage = document.getElementById("storage").value;
  const reinforcement = document.getElementById("reinforcement").value;
  const waterproof = document.getElementById("waterproof").value;
  const shipping = document.getElementById("shipping").value;
  const price = document.getElementById("price").value;
  const comment = document.getElementById("comment").checked;

  // 「その他」の場合は自由入力した作品名を使う
  const finalWork = work === "その他" ? otherWork : work;

  // タイトル
  const title =
    "Stray Kids " +
    member + " " +
    finalWork + " " +
    benefit + " " +
    cardType;

  // 商品説明
  let description = "";

  description += "Stray Kids " + member + "\n";
  description += finalWork + "\n";

  if (benefit !== "") {
    description += benefit + "\n";
  }

  description += cardType + "\n";

  if (finish !== "なし") {
    description += finish + "加工\n";
  }

  description += "\n";

  description += "商品の状態： " + condition + "\n";

  if (damage !== "") {
    description += damage + "\n";
  }

  description += storage + "\n";
  description += reinforcement + "、" + waterproof + "の上";
  description += shipping + "で発送予定です。\n";

  description += "\n";

  description += "ペン卒のため出品しています\n";
  description += "海外製品のため細かなスレ等ご了承ください\n";
  description += "素人保管ですので完璧を求める方はご遠慮ください\n";
  description += "即購入可能\n";
  description += "まとめ割対応します\n";
  description += "返品対応不可\n";

  if (comment) {
    description += "購入前にコメントお願いします\n";
  }

  // 検索キーワード
  const memberKeywords = selectedMembers
  .flatMap(member => memberAliases[member])
  .join(" ");

let workKeywords = finalWork;

      let benefitKeywords = benefit;

const benefitKey = benefit.trim().toLowerCase();

if (benefitAliases[benefitKey]) {
  benefitKeywords = benefitAliases[benefitKey].join(" ");
}

if (workAliases[finalWork]) {
  workKeywords = workAliases[finalWork].join(" ");
}

const keywords =
  "Stray Kids スキズ SKZ ストレイキッズ " +
  memberKeywords + " " +
  workKeywords + " " +
  benefitKeywords + " " +
  cardType;

  // 結果を表示
  document.getElementById("titleResult").value = title;
  document.getElementById("descriptionResult").value = description;
  document.getElementById("keywordsResult").value = keywords;

  document.getElementById("result").style.display = "block";
}
  </script>

</body>
</html>
