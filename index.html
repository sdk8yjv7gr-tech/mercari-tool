<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>メルカリ簡単出品</title>
</head>

<body>

  <h1>メルカリ簡単出品 🐱</h1>

  <p>作品名</p>
  <input type="text" id="work">

  <p>メンバー</p>
  <input type="text" id="member">

  <p>グッズの種類</p>
  <input type="text" id="goods">

  <p>商品名・内容</p>
  <input type="text" id="name">

  <p>商品の状態</p>
  <select id="condition">
    <option>新品・未使用</option>
    <option>未使用に近い</option>
    <option>目立った傷や汚れなし</option>
    <option>やや傷や汚れあり</option>
    <option>傷や汚れあり</option>
  </select>

  <p>傷や汚れ</p>
  <input type="text" id="damage">

  <p>付属品</p>
  <input type="text" id="accessories">

  <p>購入時期</p>
  <input type="text" id="date">

  <p>発送方法</p>
  <input type="text" id="shipping">

  <p>販売価格</p>
  <input type="number" id="price">

  <br><br>

  <button>出品文を作る</button>

</body>
</html>
